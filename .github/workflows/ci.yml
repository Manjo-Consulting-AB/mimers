name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  # För att kunna säga "#NN är en pull request, inte en issue" i klartext.
  # Utan den ger issues-endpointen 403 för en PR, vilket ser ut som ett
  # behörighetsfel när det i själva verket är en felaktig Closes-rad.
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Hela historiken: acceptanskontrollen nedan behöver baskommiten.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installera beroenden
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Bygget körs före testerna: en av dem läser public/build/manifest.json
      # och bevisar därmed att artefakten faktiskt produceras.
      - name: Bygg frontend
        run: npm run build

      - name: Kodstandard
        run: composer lint

      - name: Statisk analys
        run: composer analyse

      - name: Tester
        run: |
          cp .env.example .env
          php artisan key:generate
          composer test

      # Ett test som är grönt redan innan koden skrevs bevisar ingenting om sin
      # "Klart när"-punkt, och CI ser likadan ut i båda fallen. Körs sist: steget
      # bygger ett eget träd ur baskommiten och ska inte störa testerna ovan.
      - name: Nya tester är röda på baskommiten
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/rott-pa-basen.sh

  # Testsviten kör sqlite i minnet, produktionen och staging kör mysql. Issue 12
  # (M1) betalade den skillnaden i en skiftlägeskänslig jämförelse; issue 23b
  # (M3) betalade den igen, dyrare: två indexnamn som Laravel härleder till 67
  # respektive 66 tecken går rakt igenom sqlite och faller på mysqls
  # 64-teckengräns. 660 gröna tester, grön CI, och staging nere efter merge -
  # ingen instans i kedjan hade tillgång till den enda som kunde se felet.
  # Deterministiskt villkor med ett känt kommando, alltså ett skript.
  #
  # Jobbet bevisar `up()` mot en tom databas, alltså exakt det utrullningen gör.
  # Det säger inget om `down()` och inget om en migrering mot befintliga rader.
  migreringar:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mimers
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_mysql, zip
          coverage: none

      - name: Installera beroenden
        run: composer install --prefer-dist --no-interaction --no-progress

      # .env.example pekar redan på mysql på 127.0.0.1:3306 med databasen
      # `mimers` och tom root - samma värden som tjänsten ovan startas med.
      - name: Migreringarna går på MySQL
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force --no-interaction

  # Nollsummeregeln är verkningslös om ingen håller den. En regelfil som växer
  # med en punkt per retro slutar bli läst, och då styr den ingenting.
  # Deterministiskt villkor, alltså ett skript - inte en modell.
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Omfångsrutan är bindande enligt AGENTS.md men har fram tills nu bara
      # kontrollerats av granskaren. Globbarna i issue-mallen är maskinläsbara
      # med flit - deterministiskt villkor, alltså ett skript.
      - name: Diffen ligger innanför omfångsrutan
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/omfangsruta.py

      - name: Ordbudget för AGENTS.md
        run: |
          BUDGET=1800
          ORD=$(wc -w < AGENTS.md)
          echo "AGENTS.md: $ORD ord (budget $BUDGET)"
          if [ "$ORD" -gt "$BUDGET" ]; then
            echo "::error file=AGENTS.md::$ORD ord överstiger budgeten $BUDGET. Lägger ändringen till en regel ska den peka ut vilken som blev överflödig - se docs/Process/Lärdomar.md."
            exit 1
          fi

      - name: Markörerna för det synkade blocket är hela
        run: |
          BEGIN=$(grep -c 'ai-standards:begin agent-core' AGENTS.md || true)
          END=$(grep -c 'ai-standards:end agent-core' AGENTS.md || true)
          if [ "$BEGIN" != "1" ] || [ "$END" != "1" ]; then
            echo "::error file=AGENTS.md::förväntade exakt en begin- och en end-markör, hittade $BEGIN respektive $END. Synken hoppar över filen utan dem."
            exit 1
          fi
