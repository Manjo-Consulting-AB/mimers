name: Staging

# Triggern var `push` till `main` fram till 2026-09-07. Med 80 mergade PR:er på
# en vecka blev det 80 bygg- och utrullningspar, ~694 minuter i månaden, för att
# hålla staging synkad commit för commit med main. Så länge inga testare är
# ombord och ingen milstolpe är utrullad betalar den synkningen ingenting -
# staging behöver spegla det som ska befordras, inte varje mellansteg.
#
# Nu körs den på versionstaggen i stället. Det gör också steg 2 i
# releaseritualen sant i stället för ungefärligt: förut byggdes en artefakt per
# main-commit och taggen fick hoppas på att just dess commit hade en grön
# körning kvar; nu byggs artefakten på exakt den commit som ska befordras, och
# `production.yml` hämtar den. Taggen ska därför pushas *före* releasen
# publiceras - se Pipeline.md § Releaseritualen.
#
# `workflow_dispatch` finns kvar som utgång: behöver staging läsas av på en
# commit som inte ska taggas går den att starta för hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Bygge och utrullning låg i två jobb fram till 2026-09-07, delade bara av
  # artefaktöverlämningen. GitHub debiterar hel minut per jobb, och
  # utrullningssteget kör på 16 sekunder - delningen kostade alltså en hel
  # minut per körning för ingenting. `upload-artifact` fungerar lika bra i
  # samma jobb, och produktionen hämtar den precis som förut.
  slapp:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bygg backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Bygg frontend
        run: |
          npm ci
          npm run build

      - name: Paketera
        run: |
          # Arkivet skrivs utanför trädet och flyttas in efteråt. Skrivs det
          # direkt i katalogen det läser ändras "." medan tar läser den, och
          # GNU tar avslutar med kod 1 och "file changed as we read it". Det
          # slår till sporadiskt, beroende på tajmning, så felet ser ut som en
          # flakighet i CI i stället för det det är. Se Pipeline.md § Paketering.
          tar -czf ../release.tar.gz --exclude='./.git' --exclude='./tests' --exclude='./node_modules' .
          mv ../release.tar.gz release.tar.gz

      # Artefakten är det produktionen befordrar, inte något som byggs om där.
      # Den sparas därför även när jobbet också rullar ut själv.
      - name: Spara artefakten
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 90

      - name: Rulla ut
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_REMOTE: ${{ secrets.DEPLOY_PATH }}
          MAIL_MAILER: ${{ secrets.MAIL_MAILER }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_SECRET: ${{ secrets.MAILGUN_SECRET }}
          MAILGUN_ENDPOINT: ${{ secrets.MAILGUN_ENDPOINT }}
          MAILGUN_WEBHOOK_SIGNING_KEY: ${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

          RELEASE=$(date +%Y-%m-%d)-$(echo "${{ github.sha }}" | cut -c1-7)

          # DEPLOY_PATH måste vara en absolut sökväg på servern. Git Bash skriver
          # om /home/... till en Windows-sökväg när en secret sätts därifrån, och
          # värdet går inte att läsa tillbaka för att upptäcka det. Vägra tidigt
          # i stället för att skapa katalogen och råka lyckas.
          # Se Pipeline.md § Vägen in på servern.
          case "$PATH_REMOTE" in
            /*) ;;
            *) echo "DEPLOY_PATH är inte en absolut sökväg. Sätt secreten från PowerShell eller GitHubs webbgränssnitt, inte från Git Bash."; exit 1 ;;
          esac

          # Paketet skickas med ssh och cat, inte scp: scp går sedan OpenSSH 9
          # över SFTP, som inte har något skal bakom sig. Här tolkas sökvägen av
          # ett skal på servern, precis som i raden nedan.
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p $PATH_REMOTE/incoming && cat > $PATH_REMOTE/incoming/$RELEASE.tar.gz" < release.tar.gz

          # shared/.env är sedan ADR-0030 delvis renderad ur miljöns secrets: de
          # sju nycklarna nedan skrivs in, allt annat i filen lämnas orört.
          # Värdena går över stdin och aldrig som argument - argument syns i
          # `ps` för varje annan kund på den delade maskinen - och `umask 077`
          # gör att fragmentet inte ens kortvarigt är läsbart för andra.
          # env-uppdatera.sh tar bort det igen, också om den avbryts.
          #
          # Steget ligger FÖRE deploy.sh med flit: deploy.sh kör
          # `php artisan config:cache`, så en .env som uppdateras efteråt får
          # ingen effekt förrän nästa utrullning.
          printf '%s\n' \
            "FILES_URL=https://files.staging.mimers.app" \
            "MAIL_MAILER=$MAIL_MAILER" \
            "MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS" \
            "MAIL_FROM_NAME=$MAIL_FROM_NAME" \
            "MAILGUN_DOMAIN=$MAILGUN_DOMAIN" \
            "MAILGUN_SECRET=$MAILGUN_SECRET" \
            "MAILGUN_ENDPOINT=$MAILGUN_ENDPOINT" \
            "MAILGUN_WEBHOOK_SIGNING_KEY=$MAILGUN_WEBHOOK_SIGNING_KEY" \
          | ssh -p "$PORT" "$USER@$HOST" "umask 077; cat > $PATH_REMOTE/shared/.env.inkommande"
          ssh -p "$PORT" "$USER@$HOST" "bash -s -- $PATH_REMOTE" < deploy/env-uppdatera.sh
          ssh -p "$PORT" "$USER@$HOST" "bash -s -- $PATH_REMOTE $RELEASE" < deploy/deploy.sh
