name: Beroendegranskning

# Eget flöde, medvetet utanför ci.yml: en sårbarhet som publiceras i morgon
# skulle annars fälla varje orelaterad PR och stoppa kön.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'composer.lock'
      - 'package-lock.json'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked --no-interaction

      # devDependencies granskas med flit, så flaggan som utesluter dem används
      # inte: paketen som byggs in i appen (Vue, Inertia m.fl.) står där.
      # --audit-level=high fäller bara vid high eller critical.
      - name: npm audit
        run: npm audit --audit-level=high
